# O serviço Python do FinTrack (M09.4, ADR-014): lê a fatura do cartão em PDF.
# Versões exatas no uv.lock; `uv sync` instala exatamente elas.
[project]
name = "fintrack-ml"
version = "0.10.1"
description = "Leitor de faturas em PDF do FinTrack (FastAPI + pdfplumber)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.1",
    "pdfplumber>=0.11.10",
    "pyjwt[crypto]>=2.15.1",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pypdf>=6.20.1",
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/F: erros; I: ordem dos imports; B: armadilhas comuns; S: segurança (bandit); UP: Python moderno
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
# assert é o jeito do pytest; senha de teste não é segredo
"tests/*" = ["S101", "S105", "S106"]
"scripts/*" = ["S105", "S106", "S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
