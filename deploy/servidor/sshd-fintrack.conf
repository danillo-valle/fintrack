# /etc/ssh/sshd_config.d/10-fintrack.conf : SSH só com chave (M05).
# Com o FinTrack em produção nesta máquina, a porta 22 vale mais: nada de senha.
# Antes de recarregar o SSH, confira com "sudo sshd -t" e mantenha a sessão atual aberta.

# Só chave (a sua ed25519); senha e "teclado interativo" desligados
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
# Ninguém entra direto como root (use o seu usuário e sudo)
PermitRootLogin no
# Poucas tentativas por conexão e pouco tempo para autenticar
MaxAuthTries 3
LoginGraceTime 30
# Recursos que um servidor sem tela não usa
X11Forwarding no
