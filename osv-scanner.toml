# OSV-Scanner (M12.1, OWASP A03:2025, ADR-020): o CI recusa o PR quando um pacote dos lockfiles
# (pnpm-lock.yaml e services/ml/uv.lock) tem vulnerabilidade conhecida na base OSV
# (https://osv.dev, que junta os alertas do GitHub, do npm e do PyPI).
#
# O caminho normal é ATUALIZAR o pacote (pnpm update / uv lock --upgrade-package). Exceção só
# quando não há versão corrigida alcançável E o código vulnerável não roda no FinTrack; nesse
# caso, uma entrada aqui, presa ao pacote e à versão exatos, com o motivo e o prazo para rever:
#
#   [[PackageOverrides]]
#   ecosystem = "npm"
#   name = "nome-do-pacote"
#   version = "1.2.3"
#   vulnerability.ignore = true
#   effectiveUntil = 2027-01-31
#   reason = "Por que não roda no FinTrack e o que destrava a atualização (PR, versão do pai)."
#
# Uma exceção nunca vale para o pacote inteiro nem para o id do alerta sozinho: assim, a mesma
# falha em outro pacote (ou noutra versão) continua barrando. Hoje: deepmerge (M12.2) e as duas
# versões do minimatch das ferramentas de desenvolvimento (M13.1).

# GHSA-gcqx-w48m-w2h4 / CVE-2026-93753 (prototype pollution no mergeObject), sem versão corrigida.
# Quem traz: só o CLI do shadcn (shadcn -> @shadcn/registry -> deepmerge), dependência de
# desenvolvimento; o app usa do pacote shadcn só o shadcn/tailwind.css. O deepmerge roda apenas
# quando alguém roda "shadcn add" no computador de quem desenvolve, para juntar o tailwind.config
# do Tailwind v3 (o FinTrack é v4: o CLI nem chega lá), com dados do próprio repositório. Não está
# no build de produção nem na imagem (conferido no .next/standalone, M12.2). Rever no prazo ou
# quando o deepmerge ou o @shadcn/registry tiverem versão corrigida.
[[PackageOverrides]]
ecosystem = "npm"
name = "deepmerge"
version = "4.3.1"
vulnerability.ignore = true
effectiveUntil = 2027-01-31
reason = "Só o CLI do shadcn (desenvolvimento) usa; nunca roda no app nem na imagem; sem versão corrigida."

# GHSA-g3hv-75wg-m249 / CVE-2026-118764 (publicado em 29/10/2026): no minimatch, um padrão de glob
# malicioso com muitos "**/.." faz a compilação do padrão (firstPhasePreProcess, otimização 2 ou
# mais) gastar CPU e memória demais. Corrigido só no 11.0.1, uma versão maior nova: ninguém que
# usa o minimatch aqui aceita o 11 (eslint-plugin-import, -jsx-a11y e -react e o @eslint/eslintrc
# pedem ^3; o @typescript-eslint/typescript-estree, o @eslint/config-array e o @ts-morph/common do
# CLI do shadcn pedem ^10), nem nas versões mais novas deles; e forçar o 11 por override quebraria
# quem usa o ^3, que importa o pacote como função (o 11 exporta um objeto).
# Quem traz: só o ESLint, o typescript-eslint e o CLI do shadcn, ferramentas de desenvolvimento.
# Os padrões que eles compilam vêm dos arquivos de configuração do próprio repositório
# (eslint.config, tsconfig, components.json), nunca de quem usa o app. Não está no build de produção
# nem na imagem web (conferido no .next/standalone, M13.1); a imagem migrate leva as ferramentas de
# desenvolvimento do pacote db, mas só roda o prisma migrate deploy. Rever no prazo ou quando o
# ESLint, o typescript-eslint e o shadcn aceitarem o minimatch 11.
[[PackageOverrides]]
ecosystem = "npm"
name = "minimatch"
version = "3.1.5"
vulnerability.ignore = true
effectiveUntil = 2027-01-31
reason = "Só ESLint e plugins (desenvolvimento), com globs do próprio repositório; correção só no 11, que os plugins não aceitam."

[[PackageOverrides]]
ecosystem = "npm"
name = "minimatch"
version = "10.2.6"
vulnerability.ignore = true
effectiveUntil = 2027-01-31
reason = "Só typescript-eslint, ESLint e o CLI do shadcn (desenvolvimento), com globs do próprio repositório; correção só no 11."
