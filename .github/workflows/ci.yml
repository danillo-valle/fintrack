# Integração contínua: roda a cada pull request e a cada push na main.
# Os nomes dos jobs ("qualidade" e "seguranca") são os que o ruleset exige.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Menor permissão possível: o workflow só lê o código
permissions:
  contents: read

# Se você enviar outro push no mesmo PR, a execução antiga é cancelada
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: qualidade
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Baixa o código
        uses: actions/checkout@v7

      - name: Instala o pnpm (versão do campo packageManager)
        uses: pnpm/action-setup@v6

      - name: Instala o Node (versão do .node-version) e reaproveita o cache do pnpm
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Instala as dependências exatamente como no lockfile
        run: pnpm install --frozen-lockfile

      - name: Confere a formatação
        run: pnpm format:check

      - name: Lint, tipos, testes e build
        run: pnpm turbo run lint typecheck test build
        env:
          APP_VERSION: ${{ github.sha }}
          TURBO_TELEMETRY_DISABLED: 1
          NEXT_TELEMETRY_DISABLED: 1

  seguranca:
    name: seguranca
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # O gitleaks lista os commits do PR e comenta nele quando encontra um segredo
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Baixa o código com todo o histórico
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Nenhum dado financeiro no repositório
        run: git ls-files -z | xargs -0 scripts/check_no_financial_data.sh

      - name: Nenhum segredo em todo o histórico
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
