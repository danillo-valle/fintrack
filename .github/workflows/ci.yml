# Integração contínua: roda a cada pull request e a cada push na main.
# Os nomes dos jobs ("qualidade", "seguranca" e "e2e") são os que o ruleset exige.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Menor permissão possível: o workflow só lê o código
permissions:
  contents: read

# Se você enviar outro push no mesmo PR, a execução antiga é cancelada
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: qualidade
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # O build carrega a configuração do Better Auth, que confere as variáveis (src/lib/env.ts).
    # Aqui não há banco nem e-mail: são valores de mentira, só para o build passar.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_URL: http://localhost:3000
      ALLOWED_EMAILS: ana@fintrack.test
      EMAIL_FROM: FinTrack <nao-responda@fintrack.local>
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
    steps:
      - name: Baixa o código
        uses: actions/checkout@v7

      - name: Instala o pnpm (versão do campo packageManager)
        uses: pnpm/action-setup@v6

      - name: Instala o Node (versão do .node-version) e reaproveita o cache do pnpm
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Instala as dependências exatamente como no lockfile
        run: pnpm install --frozen-lockfile

      # Segredo aleatório a cada execução: nenhum segredo fixo no repositório
      - name: Gera um segredo temporário para o Better Auth
        run: |
          # Segredo descartável, só para este job. ::add-mask:: esconde o valor em todos os logs
          SECRET=$(openssl rand -base64 32)
          echo "::add-mask::$SECRET"
          echo "BETTER_AUTH_SECRET=$SECRET" >> "$GITHUB_ENV"

      - name: Confere a formatação
        run: pnpm format:check

      - name: Lint, tipos, testes e build
        run: pnpm turbo run lint typecheck test build
        env:
          APP_VERSION: ${{ github.sha }}
          TURBO_TELEMETRY_DISABLED: 1
          NEXT_TELEMETRY_DISABLED: 1

  seguranca:
    name: seguranca
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # O gitleaks lista os commits do PR e comenta nele quando encontra um segredo
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Baixa o código com todo o histórico
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Nenhum dado financeiro no repositório
        run: git ls-files -z | xargs -0 scripts/check_no_financial_data.sh

      - name: Nenhum segredo em todo o histórico
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Serviços que o GitHub sobe ao lado do job, iguais aos do compose.yml
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fintrack
          POSTGRES_PASSWORD: fintrack
          POSTGRES_DB: fintrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fintrack -d fintrack"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mail:
        image: axllent/mailpit:v1.31.3
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgresql://fintrack:fintrack@localhost:5432/fintrack
      BETTER_AUTH_URL: http://localhost:3000
      ALLOWED_EMAILS: ana@fintrack.test,bruno@fintrack.test
      EMAIL_FROM: FinTrack <nao-responda@fintrack.local>
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      PASSKEY_RP_ID: localhost
      # A consulta de senhas vazadas depende de um serviço externo: desligada no CI
      HIBP_CHECK: "off"
      MAILPIT_URL: http://localhost:8025
    steps:
      - name: Baixa o código
        uses: actions/checkout@v7

      - name: Instala o pnpm
        uses: pnpm/action-setup@v6

      - name: Instala o Node e reaproveita o cache do pnpm
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Instala as dependências
        run: pnpm install --frozen-lockfile

      - name: Instala o Chromium do Playwright e as bibliotecas do sistema
        run: pnpm --filter @fintrack/web exec playwright install --with-deps chromium

      - name: Gera um segredo temporário para o Better Auth
        run: |
          # Segredo descartável, só para este job. ::add-mask:: esconde o valor em todos os logs
          SECRET=$(openssl rand -base64 32)
          echo "::add-mask::$SECRET"
          echo "BETTER_AUTH_SECRET=$SECRET" >> "$GITHUB_ENV"

      - name: Cria as tabelas no banco de teste (migrações do Prisma)
        run: pnpm db:deploy

      # As regras que moram no banco (CHECKs, chaves, gatilho da auditoria), provadas contra
      # o Postgres de verdade. Ficam aqui porque este é o job que tem banco.
      - name: Testes de integração do banco
        run: pnpm turbo run test:integration
        env:
          TURBO_TELEMETRY_DISABLED: 1

      # Prova que o seed roda num banco que acabou de nascer (e que continua rápido)
      - name: Seed sintético num banco limpo
        run: pnpm db:seed

      - name: Testes de ponta a ponta e acessibilidade (axe)
        run: pnpm turbo run test:e2e
        env:
          TURBO_TELEMETRY_DISABLED: 1
          NEXT_TELEMETRY_DISABLED: 1

      - name: Guarda o relatório quando algo falha
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-playwright
          path: apps/web/playwright-report/
          retention-days: 7

  # ── M05: as imagens de produção ─────────────────────────────────────────────────────────
  # Em todo PR: prova que as imagens constroem, que as migrações rodam num banco limpo e que o
  # app sobe com as proteções (teste de fumaça). Num push na main, publica no GHCR.
  imagem:
    name: imagem
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write # publicar no GHCR (só acontece num push na main)
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fintrack
          POSTGRES_PASSWORD: fintrack
          POSTGRES_DB: fintrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U fintrack -d fintrack"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - name: Baixa o código
        uses: actions/checkout@v7

      - name: Confere os scripts de operação (shellcheck)
        run: shellcheck -x deploy/bin/lib.sh deploy/bin/fintrack-* deploy/bin/smoke-test deploy/servidor/*.sh

      - name: Confere o compose de produção e o Caddyfile
        run: |
          # Arquivos de variáveis de mentira, só para o compose conseguir ler o arquivo
          printf 'POSTGRES_PASSWORD=x\nTUNNEL_TOKEN=y\n' > /tmp/compose.env
          printf 'FINTRACK_VERSION=%s\n' "${{ github.sha }}" > /tmp/versao.env
          sudo mkdir -p /srv/fintrack && sudo touch /srv/fintrack/app.env
          docker compose -f deploy/compose.prod.yml --env-file /tmp/compose.env --env-file /tmp/versao.env config --quiet
          docker run --rm -v "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Prepara o Buildx (cache das camadas entre execuções)
        uses: docker/setup-buildx-action@v4

      - name: Constrói a imagem do app (web)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          load: true
          tags: fintrack-web:ci
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=fintrack-web
          cache-to: type=gha,mode=max,scope=fintrack-web

      - name: Constrói a imagem das migrações (migrate)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrate
          load: true
          tags: fintrack-migrate:ci
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=fintrack-migrate
          cache-to: type=gha,mode=max,scope=fintrack-migrate

      - name: Migrações num banco limpo, pela imagem
        run: docker run --rm --network host -e DATABASE_URL=postgresql://fintrack:fintrack@localhost:5432/fintrack fintrack-migrate:ci

      - name: Teste de fumaça, com o container endurecido como em produção
        run: |
          SECRET=$(openssl rand -base64 32)
          echo "::add-mask::$SECRET"
          docker run -d --name web --network host \
            -e DATABASE_URL=postgresql://fintrack:fintrack@localhost:5432/fintrack \
            -e BETTER_AUTH_SECRET="$SECRET" -e BETTER_AUTH_URL=http://localhost:3000 \
            -e ALLOWED_EMAILS=ana@fintrack.test -e "EMAIL_FROM=FinTrack <nao-responda@fintrack.local>" \
            -e SMTP_HOST=localhost -e SMTP_PORT=1025 -e HIBP_CHECK=off \
            --read-only --tmpfs /tmp --tmpfs /app/apps/web/.next/cache:uid=1000,gid=1000 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            fintrack-web:ci
          bash deploy/bin/smoke-test http://localhost:3000 "${{ github.sha }}"

      - name: Mostra o log do app se algo falhou
        if: failure()
        run: docker logs web || true

      - name: Entra no GHCR (só na main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publica as imagens com o commit como etiqueta (só na main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          for name in web migrate; do
            docker tag "fintrack-$name:ci" "ghcr.io/danillo-valle/fintrack-$name:${{ github.sha }}"
            docker push --quiet "ghcr.io/danillo-valle/fintrack-$name:${{ github.sha }}"
          done

  # Só na main: aponta a etiqueta :main para as imagens deste commit. O servidor vigia essa
  # etiqueta (deploy/bin/fintrack-update) e faz o deploy sozinho. Não espera o e2e: o ruleset
  # exige a branch atualizada, então esta árvore já passou no e2e do PR (ADR-005).
  publicar:
    name: publicar
    needs: [qualidade, seguranca, imagem]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepara o Buildx
        uses: docker/setup-buildx-action@v4

      - name: Entra no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiqueta :main nas imagens deste commit (sem baixar nem reconstruir)
        run: |
          for name in web migrate; do
            docker buildx imagetools create \
              --tag "ghcr.io/danillo-valle/fintrack-$name:main" \
              "ghcr.io/danillo-valle/fintrack-$name:${{ github.sha }}"
          done
          echo "Publicado: ${{ github.sha }}. O servidor faz o deploy em até 1 minuto."
