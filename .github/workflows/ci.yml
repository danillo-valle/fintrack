# Integração contínua: roda a cada pull request e a cada push na main.
# Os nomes dos jobs ("qualidade", "seguranca" e "e2e") são os que o ruleset exige.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Menor permissão possível: o workflow só lê o código
permissions:
  contents: read

# Se você enviar outro push no mesmo PR, a execução antiga é cancelada
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: qualidade
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # O build carrega a configuração do Better Auth, que confere as variáveis (src/lib/env.ts).
    # Aqui não há banco nem e-mail: são valores de mentira, só para o build passar.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_URL: http://localhost:3000
      ALLOWED_EMAILS: ana@fintrack.test
      EMAIL_FROM: FinTrack <nao-responda@fintrack.local>
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
    steps:
      - name: Baixa o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instala o pnpm (versão do campo packageManager)
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Instala o Node (versão do .node-version) e reaproveita o cache do pnpm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Instala as dependências exatamente como no lockfile
        run: pnpm install --frozen-lockfile

      # M09.4: o serviço Python (services/ml), gerenciado pelo uv com as versões do uv.lock
      - name: Instala o uv (o Python do serviço que lê o PDF)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: services/ml/uv.lock

      - name: Instala o Python e as dependências exatas do serviço (uv.lock)
        run: uv sync --frozen
        working-directory: services/ml

      # M10.1 (ADR-015): o classificador no conjunto rotulado SINTÉTICO
      # (samples/categorizacao). Falha se o acerto cair abaixo de 85 %.
      - name: Avaliação do classificador (conjunto sintético, mínimo 85 %)
        run: uv run --frozen python -m app.avaliar --minimo 0.85
        working-directory: services/ml

      # Segredo aleatório a cada execução: nenhum segredo fixo no repositório
      - name: Gera um segredo temporário para o Better Auth
        run: |
          # Segredo descartável, só para este job. ::add-mask:: esconde o valor em todos os logs
          SECRET=$(openssl rand -base64 32)
          echo "::add-mask::$SECRET"
          echo "BETTER_AUTH_SECRET=$SECRET" >> "$GITHUB_ENV"

      - name: Confere a formatação
        run: pnpm format:check

      - name: Lint, tipos, testes e build
        run: pnpm turbo run lint typecheck test build
        env:
          APP_VERSION: ${{ github.sha }}
          TURBO_TELEMETRY_DISABLED: 1
          NEXT_TELEMETRY_DISABLED: 1

  seguranca:
    name: seguranca
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Baixa o código com todo o histórico
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Nenhum dado financeiro no repositório
        run: git ls-files -z | xargs -0 scripts/check_no_financial_data.sh

      # M12.4b: o gitleaks pela imagem oficial, presa pelo digest e com limite de tempo próprio. A
      # gitleaks-action guardava o programa no cache do Actions; no dia em que o GitHub recusou o
      # cache ("Egress is over the account limit"), o passo ficou 10 minutos parado e o job foi
      # cancelado (a varredura em si leva menos de 1 s). A imagem vem do GHCR, como a do OSV, sem
      # cache. Roda com o seu usuário (o dono do checkout): o git não acusa "dubious ownership" e o
      # relatório pode ser gravado. O .gitleaks.toml da raiz vale como no hook local.
      - name: Nenhum segredo em todo o histórico
        timeout-minutes: 3
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/repo" -w /repo \
            "$GITLEAKS_IMAGE" git /repo --redact --no-banner --verbose --exit-code 1 \
            --report-format sarif --report-path /repo/gitleaks.sarif

      - name: Guarda o relatório do gitleaks (só os achados, com o segredo tapado)
        if: ${{ failure() && hashFiles('gitleaks.sarif') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks
          path: gitleaks.sarif
          retention-days: 14

      # M12.1 (OWASP A03, ADR-020): nenhuma dependência com vulnerabilidade conhecida na base
      # OSV (npm e PyPI), nos dois lockfiles. Exceção só no osv-scanner.toml, presa ao pacote e
      # à versão, com motivo e prazo. Sai com erro também se a consulta falhar (nunca passa calado).
      - name: Nenhuma dependência com vulnerabilidade conhecida (OSV-Scanner)
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=pnpm-lock.yaml
            --lockfile=services/ml/uv.lock

  # ── M12.2 (ADR-021): o E2E em escala ────────────────────────────────────────────────────
  # O banco por si: os testes de integração (CHECKs, chaves, gatilho da auditoria) contra o
  # Postgres de verdade e o seed sintético num banco que acabou de nascer.
  integracao:
    name: integracao
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fintrack
          POSTGRES_PASSWORD: fintrack
          POSTGRES_DB: fintrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fintrack -d fintrack"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mail:
        image: axllent/mailpit:v1.31.3
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgresql://fintrack:fintrack@localhost:5432/fintrack
      BETTER_AUTH_URL: http://localhost:3000
      ALLOWED_EMAILS: ana@fintrack.test,bruno@fintrack.test
      EMAIL_FROM: FinTrack <nao-responda@fintrack.local>
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      PASSKEY_RP_ID: localhost
      # A consulta de senhas vazadas depende de um serviço externo: desligada no CI
      HIBP_CHECK: "off"
      MAILPIT_URL: http://localhost:8025
      # M09.1: a Pluggy de mentira (o playwright.config.ts sobe); nunca a de verdade no CI
      PLUGGY_API_URL: http://127.0.0.1:8787
      # M09.4: o serviço Python de verdade (o playwright.config.ts sobe), com PDFs sintéticos
      ML_SERVICE_URL: http://127.0.0.1:8001
      TURBO_TELEMETRY_DISABLED: 1
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Baixa o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instala o pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Instala o Node e reaproveita o cache do pnpm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Instala as dependências
        run: pnpm install --frozen-lockfile

      - name: Gera os segredos temporários (Better Auth e chave das conexões)
        run: |
          # Segredo descartável, só para este job. ::add-mask:: esconde o valor em todos os logs
          SECRET=$(openssl rand -base64 32)
          echo "::add-mask::$SECRET"
          echo "BETTER_AUTH_SECRET=$SECRET" >> "$GITHUB_ENV"
          # M09.1: chave descartável que cifra o Client Secret sintético dos testes
          KEY=$(openssl rand -base64 32)
          echo "::add-mask::$KEY"
          echo "CONNECTION_SECRET_KEYS=1:$KEY" >> "$GITHUB_ENV"

      - name: Cria as tabelas no banco de teste (migrações do Prisma)
        run: pnpm db:deploy

      - name: Testes de integração do banco
        run: pnpm turbo run test:integration

      # Prova que o seed roda num banco que acabou de nascer (e que continua rápido)
      - name: Seed sintético num banco limpo
        run: pnpm db:seed

  # O build de produção do app, uma vez só: as 3 partes testam este mesmo build (o servidor
  # standalone, como na imagem). Valores de mentira, como na qualidade: o build não fala com nada.
  e2e-build:
    name: e2e-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_URL: http://localhost:3000
      ALLOWED_EMAILS: ana@fintrack.test
      EMAIL_FROM: FinTrack <nao-responda@fintrack.local>
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      TURBO_TELEMETRY_DISABLED: 1
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Baixa o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instala o pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Instala o Node e reaproveita o cache do pnpm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Instala as dependências
        run: pnpm install --frozen-lockfile

      - name: Build de produção do app
        run: |
          BETTER_AUTH_SECRET=$(openssl rand -base64 32)
          echo "::add-mask::$BETTER_AUTH_SECRET"
          BETTER_AUTH_SECRET="$BETTER_AUTH_SECRET" pnpm turbo run build --filter=@fintrack/web

      - name: Empacota o servidor standalone e os estáticos
        run: tar -czf e2e-build.tgz -C apps/web .next/BUILD_ID .next/standalone .next/static

      - name: Guarda o build para as partes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-build
          path: e2e-build.tgz
          retention-days: 1
          if-no-files-found: error

  # A suíte contra o build de produção, em 3 partes ao mesmo tempo (cada uma com o próprio banco).
  # Cada parte grava um "blob" do relatório; o job e2e junta os três.
  e2e-parte:
    name: e2e (parte ${{ matrix.parte }} de 3)
    needs: e2e-build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3]
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fintrack
          POSTGRES_PASSWORD: fintrack
          POSTGRES_DB: fintrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fintrack -d fintrack"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mail:
        image: axllent/mailpit:v1.31.3
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgresql://fintrack:fintrack@localhost:5432/fintrack
      BETTER_AUTH_URL: http://localhost:3000
      ALLOWED_EMAILS: ana@fintrack.test,bruno@fintrack.test
      EMAIL_FROM: FinTrack <nao-responda@fintrack.local>
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      PASSKEY_RP_ID: localhost
      # A consulta de senhas vazadas depende de um serviço externo: desligada no CI
      HIBP_CHECK: "off"
      MAILPIT_URL: http://localhost:8025
      # M09.1: a Pluggy de mentira (o playwright.config.ts sobe); nunca a de verdade no CI
      PLUGGY_API_URL: http://127.0.0.1:8787
      # M09.4: o serviço Python de verdade (o playwright.config.ts sobe), com PDFs sintéticos
      ML_SERVICE_URL: http://127.0.0.1:8001
      TURBO_TELEMETRY_DISABLED: 1
      NEXT_TELEMETRY_DISABLED: 1
      PLAYWRIGHT_PRODUCTION: "1"
    steps:
      - name: Baixa o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instala o pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Instala o Node e reaproveita o cache do pnpm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Instala as dependências
        run: pnpm install --frozen-lockfile

      # M09.4: o serviço Python (services/ml), gerenciado pelo uv com as versões do uv.lock
      - name: Instala o uv (o Python do serviço que lê o PDF)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: services/ml/uv.lock

      - name: Instala o Python e as dependências exatas do serviço (uv.lock)
        run: uv sync --frozen
        working-directory: services/ml

      - name: Instala o Chromium do Playwright e as bibliotecas do sistema
        run: pnpm --filter @fintrack/web exec playwright install --with-deps chromium

      - name: Gera os segredos temporários (Better Auth e chave das conexões)
        run: |
          # Segredo descartável, só para este job. ::add-mask:: esconde o valor em todos os logs
          SECRET=$(openssl rand -base64 32)
          echo "::add-mask::$SECRET"
          echo "BETTER_AUTH_SECRET=$SECRET" >> "$GITHUB_ENV"
          # M09.1: chave descartável que cifra o Client Secret sintético dos testes
          KEY=$(openssl rand -base64 32)
          echo "::add-mask::$KEY"
          echo "CONNECTION_SECRET_KEYS=1:$KEY" >> "$GITHUB_ENV"

      - name: Gera o cliente do Prisma (o seed e os testes importam o @fintrack/db)
        run: pnpm turbo run db:generate

      - name: Cria as tabelas no banco de teste (migrações do Prisma)
        run: pnpm db:deploy

      - name: Seed sintético (o mesmo banco de antes do M12.2)
        run: pnpm db:seed

      - name: Baixa o build de produção
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-build

      - name: Desempacota o build
        run: tar -xzf e2e-build.tgz -C apps/web

      - name: Testes de ponta a ponta e acessibilidade (axe), parte ${{ matrix.parte }} de 3
        run: pnpm turbo run test:e2e -- --shard=${{ matrix.parte }}/3

      - name: Guarda o relatório desta parte (blob, com os traces das falhas)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-parte-${{ matrix.parte }}
          path: apps/web/blob-report/
          retention-days: 1
          if-no-files-found: ignore

  # Os testes que só existem no pnpm dev (o catálogo /dev/ui, etiqueta @dev)
  e2e-dev:
    name: e2e-dev
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fintrack
          POSTGRES_PASSWORD: fintrack
          POSTGRES_DB: fintrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fintrack -d fintrack"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mail:
        image: axllent/mailpit:v1.31.3
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgresql://fintrack:fintrack@localhost:5432/fintrack
      BETTER_AUTH_URL: http://localhost:3000
      ALLOWED_EMAILS: ana@fintrack.test,bruno@fintrack.test
      EMAIL_FROM: FinTrack <nao-responda@fintrack.local>
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      PASSKEY_RP_ID: localhost
      # A consulta de senhas vazadas depende de um serviço externo: desligada no CI
      HIBP_CHECK: "off"
      MAILPIT_URL: http://localhost:8025
      # M09.1: a Pluggy de mentira (o playwright.config.ts sobe); nunca a de verdade no CI
      PLUGGY_API_URL: http://127.0.0.1:8787
      # M09.4: o serviço Python de verdade (o playwright.config.ts sobe), com PDFs sintéticos
      ML_SERVICE_URL: http://127.0.0.1:8001
      TURBO_TELEMETRY_DISABLED: 1
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Baixa o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instala o pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Instala o Node e reaproveita o cache do pnpm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Instala as dependências
        run: pnpm install --frozen-lockfile

      # M09.4: o serviço Python (services/ml), gerenciado pelo uv com as versões do uv.lock
      - name: Instala o uv (o Python do serviço que lê o PDF)
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: services/ml/uv.lock

      - name: Instala o Python e as dependências exatas do serviço (uv.lock)
        run: uv sync --frozen
        working-directory: services/ml

      - name: Instala o Chromium do Playwright e as bibliotecas do sistema
        run: pnpm --filter @fintrack/web exec playwright install --with-deps chromium

      - name: Gera os segredos temporários (Better Auth e chave das conexões)
        run: |
          # Segredo descartável, só para este job. ::add-mask:: esconde o valor em todos os logs
          SECRET=$(openssl rand -base64 32)
          echo "::add-mask::$SECRET"
          echo "BETTER_AUTH_SECRET=$SECRET" >> "$GITHUB_ENV"
          # M09.1: chave descartável que cifra o Client Secret sintético dos testes
          KEY=$(openssl rand -base64 32)
          echo "::add-mask::$KEY"
          echo "CONNECTION_SECRET_KEYS=1:$KEY" >> "$GITHUB_ENV"

      - name: Gera o cliente do Prisma (o seed e os testes importam o @fintrack/db)
        run: pnpm turbo run db:generate

      - name: Cria as tabelas no banco de teste (migrações do Prisma)
        run: pnpm db:deploy

      - name: Testes do pnpm dev (o catálogo /dev/ui)
        run: pnpm turbo run test:e2e -- --grep @dev

      - name: Guarda o relatório (blob, com os traces das falhas)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-dev
          path: apps/web/blob-report/
          retention-days: 1
          if-no-files-found: ignore

  # O check "e2e" que o ruleset exige: junta os relatórios num HTML só (com os traces) e reprova se
  # a integração, alguma parte ou o dev falhou. Roda sempre, para o relatório existir na falha.
  # ── M12.3b: o site "FinTrack por dentro" (ADR-023) ──────────────────────────────────────
  # Monta o site a partir do código (o mapa do fluxo e o C4), confere no Chromium (axe nos dois
  # temas, nada de fora, as páginas respondendo) e guarda o pacote que o job pagina publica.
  site:
    name: site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Baixa o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instala o pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Instala o Node e reaproveita o cache do pnpm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Instala as dependências
        run: pnpm install --frozen-lockfile

      - name: Instala o Chromium do Playwright e as bibliotecas do sistema
        run: pnpm --filter @fintrack/flow-map exec playwright install --with-deps chromium

      - name: Monta o site (o C4 vira SVG; um diagrama com erro para aqui)
        run: pnpm --filter @fintrack/flow-map site

      - name: Confere o site (axe, nada de fora, o mapa e o quem usa)
        run: pnpm --filter @fintrack/flow-map test:site

      - name: Guarda o relatório se algo falhar
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio-site
          path: packages/flow-map/playwright-report/
          retention-days: 14

      - name: Guarda o pacote do GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/flow-map/dist/site/

  e2e:
    name: e2e
    needs: [integracao, e2e-parte, e2e-dev, site]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Baixa o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instala o pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Instala o Node e reaproveita o cache do pnpm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Instala as dependências
        run: pnpm install --frozen-lockfile

      - name: Baixa os relatórios das partes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-*
          merge-multiple: true
          path: apps/web/blob-reports

      - name: Junta os relatórios num só
        if: ${{ hashFiles('apps/web/blob-reports/*.zip') != '' }}
        run: pnpm --filter @fintrack/web exec playwright merge-reports --reporter html blob-reports

      - name: Guarda o relatório (abra o index.html; cada falha tem o trace)
        if: ${{ hashFiles('apps/web/playwright-report/index.html') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio-playwright
          path: apps/web/playwright-report/
          retention-days: 14

      - name: Confere a integração, as 3 partes, o dev e o site
        env:
          INTEGRACAO: ${{ needs.integracao.result }}
          PARTES: ${{ needs.e2e-parte.result }}
          DEV: ${{ needs.e2e-dev.result }}
          SITE: ${{ needs.site.result }}
        run: |
          echo "integracao: $INTEGRACAO · partes: $PARTES · dev: $DEV · site: $SITE"
          test "$INTEGRACAO" = success && test "$PARTES" = success && test "$DEV" = success \
            && test "$SITE" = success

  # ── M05: as imagens de produção ─────────────────────────────────────────────────────────
  # Em todo PR: prova que as imagens constroem, que as migrações rodam num banco limpo e que o
  # app sobe com as proteções (teste de fumaça). Num push na main, publica no GHCR.
  imagem:
    name: imagem
    runs-on: ubuntu-24.04
    # M12.1: +15 min para as duas varreduras do ZAP (a logada percorre ~8 mil endereços)
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write # publicar no GHCR (só acontece num push na main)
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fintrack
          POSTGRES_PASSWORD: fintrack
          POSTGRES_DB: fintrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U fintrack -d fintrack"
          --health-interval 5s --health-timeout 3s --health-retries 20
      # M12.1: o e-mail de confirmação da conta de teste da varredura do ZAP
      mail:
        image: axllent/mailpit:v1.31.3
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - name: Baixa o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Confere os scripts de operação (shellcheck)
        run: |
          shellcheck -x deploy/bin/lib.sh deploy/bin/fintrack-* deploy/bin/smoke-test \
            deploy/servidor/*.sh deploy/testes/*.sh scripts/zap/varrer.sh scripts/zap/copia-local.sh

      # M12.4a, revisão 3: o alerta, o aviso ao Healthchecks e o fintrack-definir, sem servidor
      - name: Testa os scripts de operação
        run: bash deploy/testes/operacao.test.sh

      - name: Confere o compose de produção e o Caddyfile
        run: |
          # Arquivos de variáveis de mentira, só para o compose conseguir ler o arquivo
          printf 'POSTGRES_PASSWORD=x\nTUNNEL_TOKEN=y\n' > /tmp/compose.env
          printf 'FINTRACK_VERSION=%s\n' "${{ github.sha }}" > /tmp/versao.env
          sudo mkdir -p /srv/fintrack && sudo touch /srv/fintrack/app.env
          docker compose -f deploy/compose.prod.yml --env-file /tmp/compose.env --env-file /tmp/versao.env config --quiet
          docker run --rm -v "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          # O Caddy precisa INICIAR com o endurecimento do compose (cap_drop ALL, read_only). A
          # imagem oficial grava no programa a capacidade de abrir portas baixas; sem o cap_add
          # NET_BIND_SERVICE no compose, o Linux recusa executar ("operation not permitted").
          docker compose -f deploy/compose.prod.yml --env-file /tmp/compose.env --env-file /tmp/versao.env \
            run --rm --no-deps caddy caddy version

      - name: Prepara o Buildx (cache das camadas entre execuções)
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Constrói a imagem do app (web)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          load: true
          tags: fintrack-web:ci
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=fintrack-web
          cache-to: type=gha,mode=max,scope=fintrack-web

      - name: Constrói a imagem das migrações (migrate)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: migrate
          load: true
          tags: fintrack-migrate:ci
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=fintrack-migrate
          cache-to: type=gha,mode=max,scope=fintrack-migrate

      # M09.4: o serviço Python. Contexto = services/ml (não a raiz)
      - name: Constrói a imagem do serviço Python (ml)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/ml
          load: true
          tags: fintrack-ml:ci
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=fintrack-ml
          cache-to: type=gha,mode=max,scope=fintrack-ml

      - name: Migrações num banco limpo, pela imagem
        run: docker run --rm --network host -e DATABASE_URL=postgresql://fintrack:fintrack@localhost:5432/fintrack fintrack-migrate:ci

      - name: Teste de fumaça, com o container endurecido como em produção
        run: |
          SECRET=$(openssl rand -base64 32)
          echo "::add-mask::$SECRET"
          docker run -d --name web --network host \
            -e DATABASE_URL=postgresql://fintrack:fintrack@localhost:5432/fintrack \
            -e BETTER_AUTH_SECRET="$SECRET" -e BETTER_AUTH_URL=http://localhost:3000 \
            -e ALLOWED_EMAILS=ana@fintrack.test,zap@fintrack.test \
            -e "EMAIL_FROM=FinTrack <nao-responda@fintrack.local>" \
            -e SMTP_HOST=localhost -e SMTP_PORT=1025 -e HIBP_CHECK=off \
            --read-only --tmpfs /tmp --tmpfs /app/apps/web/.next/cache:uid=1000,gid=1000 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            fintrack-web:ci
          bash deploy/bin/smoke-test http://localhost:3000 "${{ github.sha }}"

      - name: Teste de fumaça do serviço Python, endurecido como em produção
        run: |
          docker run -d --name ml --network host --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -e ML_JWKS_URL=http://127.0.0.1:3000/api/auth/jwks \
            fintrack-ml:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8001/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8001/health | grep -q '"ok"'
          # Sem token, nada é lido: 401
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/pdf' \
            --data-binary @samples/pdf/exemplo-visa-0002.pdf http://127.0.0.1:8001/v1/faturas)
          test "$code" = 401 || { echo "esperava 401 sem token, veio $code"; exit 1; }
          # M10.1: sem token, o classificador também recusa (401)
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' \
            -d '{}' http://127.0.0.1:8001/v1/classificador/sugerir)
          test "$code" = 401 || { echo "classificador sem token: esperava 401, veio $code"; exit 1; }
          # M10.2b: sem token, a IA local também recusa (401), antes de olhar o pedido
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' \
            -d '{}' http://127.0.0.1:8001/v1/ia/sugerir)
          test "$code" = 401 || { echo "IA local sem token: esperava 401, veio $code"; exit 1; }
          # A imagem não leva dado de ninguém: a pasta dos modelos nasce vazia e o conjunto
          # rotulado (samples/) não entra
          docker run --rm --entrypoint sh fintrack-ml:ci -c \
            'test -d /data/modelos && test -z "$(ls -A /data/modelos)" && ! find / -xdev -name "rotulado*" 2>/dev/null | grep -q .'

      # ── M12.1: a varredura de segurança do ZAP contra a imagem (OWASP Top 10, ADR-020) ────
      # PASSIVA (só observa, nada é atacado), no app que acabou de passar na fumaça, com o banco
      # limpo. Duas rodadas: sem sessão, e com uma conta de TESTE criada pelo caminho de verdade
      # (cadastro, o link do e-mail no Mailpit, o 2FA). Barra o PR com alerta de risco Baixo ou
      # maior; exceção só no scripts/zap/plano.yaml, sempre com o motivo.
      - name: Conta de teste da varredura (cadastro, e-mail e 2FA de verdade)
        id: conta-zap
        run: |
          node scripts/zap/conta-de-teste.mjs --url http://localhost:3000 \
            --mailpit http://localhost:8025 --email zap@fintrack.test \
            --saida "$RUNNER_TEMP/zap-cookie"
          # O cookie da conta de teste não aparece em log nenhum, nem por engano
          echo "::add-mask::$(cat "$RUNNER_TEMP/zap-cookie")"

      - name: Dados sintéticos para a varredura logada (o seed, pela imagem das migrações)
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgresql://fintrack:fintrack@localhost:5432/fintrack \
            -e SEED_VIEWER_EMAIL=zap@fintrack.test \
            fintrack-migrate:ci prisma db seed

      - name: Varredura do ZAP sem sessão (telas de entrada, webhooks, arquivos públicos)
        run: bash scripts/zap/varrer.sh http://localhost:3000 relatorios-zap

      - name: Varredura do ZAP com a sessão de teste (as telas com os dados)
        if: ${{ !cancelled() && steps.conta-zap.outcome == 'success' }}
        run: bash scripts/zap/varrer.sh http://localhost:3000 relatorios-zap "$RUNNER_TEMP/zap-cookie"

      - name: Guarda os relatórios do ZAP (HTML e JSON)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorios-zap
          path: relatorios-zap/
          retention-days: 14
          if-no-files-found: ignore

      - name: Mostra o log do app se algo falhou
        if: failure()
        run: |
          docker logs web || true
          docker logs ml || true

      - name: Entra no GHCR (só na main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publica as imagens com o commit como etiqueta (só na main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          for name in web migrate ml; do
            docker tag "fintrack-$name:ci" "ghcr.io/danillo-valle/fintrack-$name:${{ github.sha }}"
            docker push --quiet "ghcr.io/danillo-valle/fintrack-$name:${{ github.sha }}"
          done

  # Só na main: aponta a etiqueta :main para as imagens deste commit. O servidor vigia essa
  # etiqueta (deploy/bin/fintrack-update) e faz o deploy sozinho. Não espera o e2e: o ruleset
  # exige a branch atualizada, então esta árvore já passou no e2e do PR (ADR-005).
  publicar:
    name: publicar
    needs: [qualidade, seguranca, imagem]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepara o Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Entra no GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiqueta :main nas imagens deste commit (sem baixar nem reconstruir)
        run: |
          for name in web migrate ml; do
            docker buildx imagetools create \
              --tag "ghcr.io/danillo-valle/fintrack-$name:main" \
              "ghcr.io/danillo-valle/fintrack-$name:${{ github.sha }}"
          done
          echo "Publicado: ${{ github.sha }}. O servidor faz o deploy em até 1 minuto."

  # ── M12.3b: publica o site no GitHub Pages, só da main e só com os checks que barram o PR ──
  pagina:
    name: pagina
    needs: [qualidade, seguranca, site]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publica.outputs.page_url }}
    steps:
      - name: Publica o pacote do job site
        id: publica
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
