# Dependabot abre PRs semanais atualizando dependências.
# Atualizações pequenas vêm agrupadas num PR só, para não virar enxurrada.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      menores:
        update-types: [minor, patch]
    # Saltos de versão maior que já se mostraram incompatíveis (testados no M03):
    # TypeScript 7 (o typescript-eslint ainda não suporta), ESLint 10 (quebra o plugin do React)
    # e @types/node acima do Node que o projeto usa (.node-version = 24).
    # Cada um volta num módulo de manutenção, testado de propósito.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    commit-message:
      prefix: ci
