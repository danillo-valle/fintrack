packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  lefthook: true
  "@prisma/engines": true
  prisma: true
  # esbuild (usado pelo tsx do seed): o binário já vem no pacote @esbuild/linux-x64;
  # o script de instalação só confere isso, então fica desligado
  esbuild: false
  sharp: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - "@better-auth/core@1.7.7"
  - "@better-auth/drizzle-adapter@1.7.7"
  - "@better-auth/kysely-adapter@1.7.7"
  - "@better-auth/memory-adapter@1.7.7"
  - "@better-auth/mongo-adapter@1.7.7"
  - "@better-auth/passkey@1.7.7"
  - "@better-auth/prisma-adapter@1.7.7"
  - "@better-auth/telemetry@1.7.7"
  - better-auth@1.7.7
